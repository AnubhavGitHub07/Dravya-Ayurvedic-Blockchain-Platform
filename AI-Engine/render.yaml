services:
  - type: web
    name: dravya-ai-engine
    runtime: python
    rootDir: AI-Engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DRAVYA_FRONTEND_ORIGIN
        sync: false
      - key: DRAVYA_LLM_PROVIDER
        value: "mock"
